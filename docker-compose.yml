name: ontime

x-kafka-common-env: &kafka-common-env
  KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 60s

x-oracle-healthcheck: &oracle-healthcheck
  test: ["CMD", "/opt/oracle/healthcheck.sh"]
  interval: 15s
  timeout: 10s
  retries: 20
  start_period: 180s

services:
  kafka-1:
    image: apache/kafka:4.3.2
    ports:
      - "${KAFKA_1_HOST_PORT:-9092}:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:${KAFKA_1_HOST_PORT:-9092}
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck
    networks: [ontime-net]

  kafka-2:
    image: apache/kafka:4.3.2
    ports:
      - "${KAFKA_2_HOST_PORT:-9094}:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:${KAFKA_2_HOST_PORT:-9094}
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck
    networks: [ontime-net]

  kafka-3:
    image: apache/kafka:4.3.2
    ports:
      - "${KAFKA_3_HOST_PORT:-9096}:9096"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:${KAFKA_3_HOST_PORT:-9096}
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck
    networks: [ontime-net]

  kafka-setup:
    image: apache/kafka:4.3.2
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        BS=kafka-1:29092
        for topic in identity.events attendence.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" \
            --create --if-not-exists --topic "$$topic" \
            --partitions 4 --replication-factor 3
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" --list
    networks: [ontime-net]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    ports:
      - "${KAFKA_UI_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ontime
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    networks: [ontime-net]

  db-identity:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "${DB_IDENTITY_HOST_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-SysPassword1}
      APP_USER: ${DB_IDENTITY_USER:-IDENTITY}
      APP_USER_PASSWORD: ${DB_IDENTITY_PASSWORD:-IdentityPass1}
    volumes:
      - db-identity-data:/opt/oracle/oradata
    healthcheck: *oracle-healthcheck
    networks: [ontime-net]

  db-attendence:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "${DB_ATTENDENCE_HOST_PORT:-1523}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-SysPassword1}
      APP_USER: ${DB_ATTENDENCE_USER:-ATTENDENCE}
      APP_USER_PASSWORD: ${DB_ATTENDENCE_PASSWORD:-AttendencePass1}
    volumes:
      - db-attendence-data:/opt/oracle/oradata
    healthcheck: *oracle-healthcheck
    networks: [ontime-net]

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"
      - "${MAILDEV_SMTP_PORT:-1025}:1025"
    environment:
      MAILDEV_WEB_PORT: "1080"
      MAILDEV_SMTP_PORT: "1025"
    networks: [ontime-net]

networks:
  ontime-net:
    driver: bridge

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  db-identity-data:
  db-attendence-data:
