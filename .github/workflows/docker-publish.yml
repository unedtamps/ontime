name: Build and publish Docker images

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service:
          - web
          - api-gateway
          - identity
          - attendence
          - notification
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ !env.ACT && github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Secrets are empty on pull requests from forks; fall back to a
          # placeholder namespace since those runs only build, never push.
          images: ${{ secrets.DOCKERHUB_USERNAME || 'ontime-ci' }}/ontime-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=ontime-${{ matrix.service }}
            org.opencontainers.image.description=Ontime ${{ matrix.service }} service

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          platforms: linux/amd64
          # Only master pushes and manual dispatches publish images. Local
          # runs through act never push.
          push: ${{ !env.ACT && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GATEWAY_INTERNAL_URL=${{ vars.GATEWAY_INTERNAL_URL || 'http://api-gateway:3001' }}
          # act has no GitHub Actions cache backend, so skip it locally.
          cache-from: ${{ env.ACT && '' || 'type=gha,scope=ontime' }}
          cache-to: ${{ env.ACT && '' || 'type=gha,mode=max,scope=ontime' }}
